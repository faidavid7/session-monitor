<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><meta name="robots" content="noindex,nofollow"><title>Session Monitor</title><style>
:root{--bg:#f3efe6;--sf:#fffdf8;--ink:#1c1a16;--sub:#6d675b;--line:#e2dac9;--acc:#9a3b1f;--soft:#ebe5d6;
--active:#1b7f46;--slow:#a86b10;--idle:#52606d;--stopped:#bb3328;--limit:#6b3fc4;--shadow:0 1px 0 #fff inset,0 6px 18px -10px rgba(60,40,10,.35)}
@media(prefers-color-scheme:dark){:root{--bg:#0f0e0c;--sf:#1a1814;--ink:#ece6d8;--sub:#a0988a;--line:#2f2b24;--acc:#e8825f;--soft:#26231d;
--active:#4cc380;--slow:#e0a24a;--idle:#8fa0b1;--stopped:#f06a5c;--limit:#a98aff;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 20px -12px #000}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
background-image:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0);background-size:22px 22px}
.mono,.num,time,code{font-family:ui-monospace,"JetBrains Mono","Cascadia Mono",Consolas,monospace}
#out{max-width:1280px;margin:0 auto;padding:18px 16px 90px;overflow-wrap:anywhere}
.top h1{font:800 clamp(24px,5vw,34px)/1.1 "Noto Serif TC","Songti TC","PMingLiU",serif;margin:6px 0 4px;letter-spacing:.02em}
.top h1 em{color:var(--acc);font-style:normal}
.sub{color:var(--sub);font-size:12.5px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin:16px 0 8px}
.tile{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);border-top:3px solid var(--c,var(--ink))}
.tile b{display:block;font-size:24px;line-height:1.1}.tile span{font-size:12px;color:var(--sub)}
.grp{margin-top:26px}.grp>summary,.gh{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.grp>summary::-webkit-details-marker{display:none}
.gh h2{font:700 19px/1 "Noto Serif TC",serif;margin:0}.gh .n{font-size:13px;background:var(--ink);color:var(--bg);border-radius:99px;padding:1px 9px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-top:14px}
.card{background:var(--sf);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0;animation:in .4s}
@keyframes in{from{transform:translateY(6px)}}
.s-active{--c:var(--active)}.s-slow{--c:var(--slow)}.s-idle{--c:var(--idle)}.s-stopped{--c:var(--stopped)}.s-limit{--c:var(--limit)}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:700;font-size:17px;line-height:1.25;min-width:0}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--c);border:1.5px solid var(--c);border-radius:99px;padding:2px 10px 2px 8px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}.s-active .pill i{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--stopped);border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.cwd{font-size:12px;color:var(--sub);font-family:ui-monospace,Consolas,monospace}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;flex-wrap:wrap}.row>span:first-child{color:var(--sub)}
.bar{height:7px;background:var(--soft);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--c));border-radius:4px}
details.rep summary{cursor:pointer;font-size:13px;color:var(--acc);font-weight:600}
details.rep .md{max-height:360px;overflow:auto;font-size:13px;line-height:1.55;background:var(--soft);padding:8px 10px;border-radius:8px;margin-top:6px;overflow-wrap:anywhere}
.md p,.md ul,.md ol{margin:4px 0}.md ul,.md ol{padding-left:18px}.md li.sub{margin-left:14px;list-style:circle}.md h4{margin:8px 0 4px;font-size:13.5px}.md code{font-family:ui-monospace,monospace;font-size:12px;background:var(--bg);padding:0 3px;border-radius:4px}.md pre.cb{white-space:pre-wrap;font-size:12px;background:var(--bg);padding:6px;border-radius:6px}.md .tw{overflow-x:auto}.md table{border-collapse:collapse;font-size:12px;margin:4px 0}.md th,.md td{border:1px solid var(--line,#8884);padding:3px 6px;text-align:left;vertical-align:top}
.gpu{margin:6px 0}.gp{margin:4px 0 0;padding-left:16px;font-size:12px}.gp li{margin:2px 0}
details.rep pre{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.5 inherit;font-family:inherit;background:var(--soft);padding:8px 10px;border-radius:8px;max-height:220px;overflow:auto}
.ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:13px;color:var(--sub)}
select{font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-height:36px}
.warn{color:var(--stopped)}.ok{color:var(--active)}
.card.ig{opacity:.7;gap:6px}
@media(max-width:420px){.cards{grid-template-columns:minmax(0,1fr)}.sum{grid-template-columns:repeat(2,1fr)}}
</style><style>
#gate{max-width:340px;margin:0 auto;padding:22vh 20px 0;text-align:center}
#gate h1{font:800 28px/1.2 "Noto Serif TC","Songti TC",serif;margin:0 0 4px}#gate h1 em{color:var(--acc);font-style:normal}
#gate .sub{margin-bottom:18px}
#gate input{width:100%;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);background:var(--sf);border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px}
#gate input:focus{outline:2px solid var(--acc);border-color:transparent}
#gate button{width:100%;padding:12px;font:inherit;font-size:16px;font-weight:700;color:var(--bg);background:var(--ink);border:0;border-radius:10px;cursor:pointer}
#err{color:var(--stopped);min-height:1.4em;margin-top:8px;font-size:14px}
#toast{position:fixed;left:12px;right:12px;bottom:12px;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;box-shadow:0 10px 30px -8px rgba(0,0,0,.5);z-index:9}
#toast[hidden]{display:none}#toast a{color:var(--bg);font-weight:700;text-decoration:underline}
</style>
<div id="gate"><div class="sub mono">SESSION MONITOR</div><h1>Claude Code <em>監控台</em></h1><div class="sub">請輸入密碼</div>
<input id="pw" type="password" placeholder="密碼" autocomplete="current-password" autofocus><button id="go">進入</button><div id="err"></div></div>
<div id="out"></div><div id="toast" hidden></div>

const agoS=t=>{const m=(Date.now()-t)/60000;return m<1?"<1 分":m<60?(m|0)+" 分":m<1440?(m/60).toFixed(1)+" 時":(m/1440).toFixed(1)+" 天"};
function tickAgo(){document.querySelectorAll("time[data-t]").forEach(e=>{e.textContent=agoS(+e.dataset.t)+"前"})}
function saveView(){try{sessionStorage.setItem("open",JSON.stringify([...document.querySelectorAll("details[data-k]")].filter(d=>d.open).map(d=>d.dataset.k)));sessionStorage.setItem("y",scrollY)}catch(e){}}
function restoreView(){try{const o=sessionStorage.getItem("open");if(o!==null){const s=JSON.parse(o);document.querySelectorAll("details[data-k]").forEach(d=>{d.open=s.includes(d.dataset.k)})}scrollTo(0,+sessionStorage.getItem("y")||0)}catch(e){}}
async function open(pw,quiet){try{

 try{sessionStorage.setItem("pw",pw)}catch(e){}
 restoreView();tickAgo();setInterval(tickAgo,15000);

}catch(e){if(!quiet)$("err").textContent="密碼錯誤"}}
